<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Local</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        #header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #28a745;
            color: white;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            z-index: 1000;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }

        #map {
            height: 100vh;
            width: 100%;
            margin-top: -10px;
        }
    </style>
</head>
<body>
    <div id="header">Selecione um Local no Mapa</div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-25.2938, -54.0946], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        var marker;
        window.selectedLocation = null;

        map.on('click', async function (e) {
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
            window.selectedLocation = e.latlng;

            // Obter o endereço através da API Nominatim
            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`);
            if (response.ok) {
                const data = await response.json();
                window.selectedAddress = data.display_name; // Salvar o endereço como string
            } else {
                window.selectedAddress = "Endereço não encontrado";
            }
        });

    </script>
</body>
</html>
